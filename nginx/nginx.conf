# Nginx как единая точка входа (доп. задание: Nginx, масштабирование, отказоустойчивость).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    # Ограничение частоты запросов (доп. задание, пункт 7)
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;

    # Docker DNS: повторное разрешение имени app -> все реплики (балансировка)
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;

        location / {
            limit_req zone=req_limit burst=40 nodelay;

            set $backend http://app:8000;
            proxy_pass $backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Отказоустойчивость: при ошибке/таймауте пробуем другую реплику (пункт 7)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
        }
    }
}
