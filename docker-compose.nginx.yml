# Накладка для доп. задания: nginx + 2 реплики приложения.
# Запуск:  docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d --build
name: auctions

services:
  app:
    # прямой доступ к приложению снаружи запрещён (пункт 2 доп. задания):
    # убираем публикацию порта и поднимаем несколько экземпляров.
    ports: !reset []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    user: "101:101"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8090}:8080"            # единственная точка входа наружу
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    stop_grace_period: 10s
    restart: unless-stopped
