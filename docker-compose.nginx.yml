# Накладка для доп. задания: nginx + 2 реплики приложения.
# Запуск:  docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d --build
name: auctions

services:
  app:
    # прямой доступ к приложению снаружи запрещён (пункт 2 доп. задания):
    # убираем публикацию порта и поднимаем несколько экземпляров.
    ports: !reset []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.75"
          memory: 384M

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"            # единственная точка входа наружу
    networks:
      - backend
    restart: unless-stopped
