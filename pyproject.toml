[project]
name = "auctions-api"
version = "0.1.0"
description = "HTTP API для учёта аукционов и продаж лотов"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "itsdangerous==2.2.0",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "defusedxml==0.7.1",
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src/auctions"]
branch = true

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
